<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Form & Fit" />
  <meta name="theme-color" content="#f8fafc" id="meta-theme-color" />
  <title>Form &amp; Fit — Visual Workout Tracker &amp; Photo Form Guide</title>
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%23ec4899'/%3E%3Cstop offset='100%25' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='180' height='180' rx='40' fill='url(%23g)'/%3E%3Cg fill='none' stroke='%23ffffff' stroke-width='12' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M52 90h76'/%3E%3Crect x='34' y='64' width='18' height='52' rx='6' fill='%23ffffff'/%3E%3Crect x='128' y='64' width='18' height='52' rx='6' fill='%23ffffff'/%3E%3Crect x='18' y='74' width='14' height='32' rx='5' fill='%23ffffff'/%3E%3Crect x='148' y='74' width='14' height='32' rx='5' fill='%23ffffff'/%3E%3C/g%3E%3C/svg%3E" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ec4899'/%3E%3Cpath d='M18 32h28M14 22v20M50 22v20' stroke='%23fff' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-2: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #db2777;
      --primary-soft: #fce7f3;
      --primary-text: #be185d;
      --accent: #7c3aed;
      --accent-soft: #ede9fe;
      --success: #10b981;
      --success-soft: #d1fae5;
      --warning: #f59e0b;
      --warning-soft: #fef3c7;
      --danger: #ef4444;
      --danger-soft: #fee2e2;
      --shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
      --shadow-lg: 0 10px 28px rgba(15, 23, 42, 0.12);
      --radius: 16px;
      --radius-sm: 10px;
      --safe-top: env(safe-area-inset-top, 12px);
      --safe-bottom: env(safe-area-inset-bottom, 16px);
    }

    [data-theme="dark"] {
      --bg: #0b1120;
      --surface: #131c31;
      --surface-2: #1e293b;
      --border: #27354f;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #f472b6;
      --primary-soft: rgba(244, 114, 182, 0.16);
      --primary-text: #f9a8d4;
      --accent: #a78bfa;
      --accent-soft: rgba(167, 139, 250, 0.16);
      --success: #34d399;
      --success-soft: rgba(52, 211, 153, 0.16);
      --warning: #fbbf24;
      --warning-soft: rgba(251, 191, 36, 0.16);
      --danger: #f87171;
      --danger-soft: rgba(248, 113, 113, 0.16);
      --shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.55);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      min-height: 100dvh;
      overscroll-behavior-y: none;
    }

    /* Header */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: color-mix(in srgb, var(--surface) 88%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: calc(var(--safe-top) + 8px) 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      display: grid;
      place-items: center;
      color: #fff;
      flex-shrink: 0;
    }

    .brand-title {
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .brand-sub {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease;
    }

    .icon-btn:active {
      transform: scale(0.94);
    }

    /* Main Content */
    .main-container {
      max-width: 680px;
      margin: 0 auto;
      padding: 16px 16px calc(92px + var(--safe-bottom));
    }

    .tab-view {
      display: none;
      animation: fadeIn 0.18s ease;
    }

    .tab-view.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-weight: 600;
      font-size: 14px;
      padding: 11px 16px;
      border-radius: 12px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease;
      min-height: 42px;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #ffffff;
      box-shadow: 0 4px 14px color-mix(in srgb, var(--primary) 30%, transparent);
    }

    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      border-color: var(--border);
    }

    .btn-soft {
      background: var(--primary-soft);
      color: var(--primary-text);
    }

    .btn-success {
      background: var(--success);
      color: #ffffff;
    }

    .btn-danger-soft {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .btn-sm {
      padding: 7px 11px;
      font-size: 12.5px;
      min-height: 34px;
      border-radius: 9px;
    }

    .btn-block {
      width: 100%;
    }

    /* Cards & Sections */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }

    .workout-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .workout-title {
      font-size: 17px;
      font-weight: 700;
      margin: 0 0 3px;
    }

    .workout-meta {
      font-size: 12.5px;
      color: var(--text-muted);
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      background: var(--surface-2);
      color: var(--text-muted);
    }

    .badge-primary {
      background: var(--primary-soft);
      color: var(--primary-text);
    }

    .badge-accent {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .badge-success {
      background: var(--success-soft);
      color: var(--success);
    }

    .ex-preview-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin: 12px 0 14px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .ex-preview-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 13.5px;
      padding: 5px 8px;
      border-radius: 9px;
      background: var(--surface-2);
    }

    .ex-preview-name {
      font-weight: 600;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ex-preview-sets {
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }

    .eye-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--primary-text);
      border-radius: 7px;
      padding: 4px 8px;
      font-size: 11.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }

    .card-actions {
      display: flex;
      gap: 8px;
    }

    /* Empty State & Starter Packs */
    .empty-box {
      text-align: center;
      padding: 28px 18px;
      background: var(--surface);
      border: 1.5px dashed var(--border);
      border-radius: var(--radius);
      margin-bottom: 16px;
    }

    .empty-icon {
      width: 52px;
      height: 52px;
      border-radius: 16px;
      background: var(--primary-soft);
      color: var(--primary-text);
      display: inline-grid;
      place-items: center;
      margin-bottom: 10px;
    }

    .starter-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 14px;
      text-align: left;
    }

    .starter-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }

    /* Search & Filter Pills */
    .search-wrap {
      position: relative;
      margin-bottom: 12px;
    }

    .search-input {
      width: 100%;
      padding: 11px 14px 11px 38px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .pill-strip {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }

    .pill-strip::-webkit-scrollbar {
      display: none;
    }

    .pill {
      padding: 7px 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .pill.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    /* Exercise Guide Card */
    .guide-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: var(--shadow);
    }

    .guide-card-head {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .guide-thumb {
      width: 72px;
      height: 72px;
      border-radius: 12px;
      background: #ffffff;
      border: 1px solid var(--border);
      flex-shrink: 0;
      overflow: hidden;
      display: grid;
      place-items: center;
      position: relative;
    }

    .guide-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .guide-info {
      flex: 1;
      min-width: 0;
    }

    .guide-name {
      font-weight: 700;
      font-size: 15.5px;
      margin: 0 0 4px;
    }

    .guide-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    /* =========================================================================
       REAL START & PEAK PHOTO FLIPBOOK STAGE
       ========================================================================= */
    .flipbook-stage {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 12px;
      margin: 12px 0;
      text-align: center;
    }

    .flipbook-viewport {
      position: relative;
      width: 100%;
      max-width: 340px;
      aspect-ratio: 4 / 3;
      margin: 0 auto;
      border-radius: 12px;
      overflow: hidden;
      background: #ffffff;
      border: 1px solid var(--border);
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.06);
      cursor: pointer;
      user-select: none;
    }

    .flipbook-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #ffffff;
      transition: opacity 0.38s ease-in-out;
    }

    .flipbook-img.pose-0 {
      opacity: 1;
      z-index: 1;
    }

    .flipbook-img.pose-1 {
      opacity: 0;
      z-index: 2;
    }

    .flipbook-viewport[data-active-pose="1"] .flipbook-img.pose-1 {
      opacity: 1;
    }

    .flipbook-phase-badge {
      position: absolute;
      top: 9px;
      left: 9px;
      z-index: 4;
      background: rgba(15, 23, 42, 0.78);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      padding: 4px 9px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      pointer-events: none;
    }

    .flipbook-phase-badge .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #f472b6;
    }

    .flipbook-viewport[data-active-pose="1"] .flipbook-phase-badge .dot {
      background: #34d399;
    }

    .flipbook-tap-hint {
      position: absolute;
      bottom: 8px;
      right: 8px;
      z-index: 4;
      background: rgba(15, 23, 42, 0.62);
      color: #ffffff;
      font-size: 10.5px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 7px;
      pointer-events: none;
    }

    .flipbook-fallback {
      position: absolute;
      inset: 0;
      z-index: 3;
      background: var(--surface-2);
      color: var(--text);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      text-align: center;
    }

    .flipbook-fallback.visible {
      display: flex;
    }

    .pose-controls {
      display: inline-flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      gap: 3px;
      margin-top: 10px;
    }

    .pose-btn {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 11px;
      border-radius: 7px;
      cursor: pointer;
    }

    .pose-btn.active {
      background: var(--primary);
      color: #ffffff;
    }

    .muscle-legend {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11.5px;
      color: var(--primary-text);
      font-weight: 600;
      margin-top: 7px;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--primary);
      animation: pulseGlow 1.5s infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.45); opacity: 0.55; }
    }

    .steps-list {
      margin: 10px 0;
      padding-left: 20px;
      font-size: 13.5px;
    }

    .steps-list li {
      margin-bottom: 6px;
    }

    .cue-box {
      background: var(--accent-soft);
      border-left: 3px solid var(--accent);
      padding: 10px 12px;
      border-radius: 0 10px 10px 0;
      font-size: 13px;
      margin-top: 8px;
    }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 35;
      background: color-mix(in srgb, var(--surface) 92%, transparent);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      padding: 8px 8px calc(8px + var(--safe-bottom));
    }

    .nav-item {
      border: none;
      background: transparent;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      padding: 4px 0;
    }

    .nav-item.active {
      color: var(--primary);
    }

    /* Active Workout Player Overlay */
    .player-overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: var(--bg);
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    .player-overlay.open {
      display: flex;
    }

    .player-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: calc(var(--safe-top) + 8px) 14px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .player-timer {
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      font-weight: 700;
      color: var(--primary-text);
      background: var(--primary-soft);
      padding: 4px 10px;
      border-radius: 999px;
    }

    .player-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 14px calc(120px + var(--safe-bottom));
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
    }

    .ex-nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .ex-dots {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 2px;
    }

    .ex-dot {
      min-width: 28px;
      height: 28px;
      padding: 0 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .ex-dot.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .ex-dot.done {
      background: var(--success-soft);
      color: var(--success);
      border-color: var(--success);
    }

    /* Collapsible Form Guide inside Player */
    .form-accordion {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 14px;
      overflow: hidden;
    }

    .form-accordion-btn {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
    }

    .form-accordion-body {
      padding: 0 14px 14px;
      border-top: 1px solid var(--border);
    }

    /* Set Logging Table */
    .set-row {
      display: grid;
      grid-template-columns: 32px 1fr 1.15fr 1.15fr 44px;
      align-items: center;
      gap: 6px;
      padding: 8px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      margin-bottom: 8px;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .set-row.completed {
      background: var(--success-soft);
      border-color: color-mix(in srgb, var(--success) 45%, transparent);
    }

    .set-num {
      font-weight: 800;
      font-size: 13px;
      text-align: center;
      color: var(--text-muted);
    }

    .prev-val {
      font-size: 11.5px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.2;
    }

    .stepper {
      display: flex;
      align-items: center;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 9px;
      overflow: hidden;
    }

    .step-btn {
      width: 28px;
      height: 36px;
      border: none;
      background: transparent;
      color: var(--text);
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .step-input {
      width: 100%;
      min-width: 0;
      border: none;
      background: transparent;
      color: var(--text);
      text-align: center;
      font-weight: 700;
      font-size: 14px;
      padding: 4px 0;
      outline: none;
    }

    .check-btn {
      width: 42px;
      height: 38px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--surface-2);
      color: var(--text-muted);
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .set-row.completed .check-btn {
      background: var(--success);
      border-color: var(--success);
      color: #ffffff;
    }

    /* Floating Rest Timer */
    .rest-pill {
      position: fixed;
      bottom: calc(16px + var(--safe-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 70;
      background: var(--text);
      color: var(--bg);
      padding: 10px 14px;
      border-radius: 999px;
      box-shadow: var(--shadow-lg);
      display: none;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 14px;
    }

    .rest-pill.visible {
      display: flex;
    }

    .rest-chip {
      background: rgba(255, 255, 255, 0.16);
      border: none;
      color: inherit;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 80;
      background: rgba(15, 23, 42, 0.58);
      backdrop-filter: blur(4px);
      display: none;
      align-items: flex-end;
      justify-content: center;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      background: var(--surface);
      color: var(--text);
      width: 100%;
      max-width: 640px;
      max-height: 90dvh;
      border-radius: 22px 22px 0 0;
      padding: 18px 16px calc(22px + var(--safe-bottom));
      overflow-y: auto;
      box-shadow: var(--shadow-lg);
      animation: slideUp 0.2s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(24px); opacity: 0.7; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
      margin: 0;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-label {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
    }

    /* Metrics Tab */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .kpi-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .kpi-label {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .kpi-val {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-top: 3px;
    }

    .vol-bar-row {
      margin-bottom: 10px;
    }

    .vol-bar-top {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .vol-track {
      height: 9px;
      border-radius: 999px;
      background: var(--surface-2);
      overflow: hidden;
    }

    .vol-fill {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--primary), var(--accent));
    }

    .heatmap-grid {
      display: grid;
      grid-template-columns: repeat(14, 1fr);
      gap: 5px;
      margin-top: 10px;
    }

    .heat-cell {
      aspect-ratio: 1;
      border-radius: 4px;
      background: var(--surface-2);
      border: 1px solid var(--border);
    }

    .heat-cell.l1 { background: color-mix(in srgb, var(--primary) 35%, var(--surface)); border-color: transparent; }
    .heat-cell.l2 { background: color-mix(in srgb, var(--primary) 70%, var(--surface)); border-color: transparent; }
    .heat-cell.l3 { background: var(--primary); border-color: transparent; }

    /* Resume Banner */
    .resume-banner {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #fff;
      padding: 12px 14px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }
  </style>
</head>

  <script>
    /* =========================================================================
       ISOLATED STORAGE KEYS (wife_wt_v1_*)

    const STORAGE_KEYS = {
      WORKOUTS: 'wife_wt_v1_workouts',

      THEME: 'wife_wt_v1_theme',

      GUIDE_EXPANDED: 'wife_wt_v1_guide_expanded'

    /* =========================================================================
       48 BUILT-IN EXERCISES MAPPED TO FREE-EXERCISE-DB REAL START & PEAK PHOTOS

    const BUILTIN_EXERCISES = [
      // GLUTES (8)
      { id: 'barbell_hip_thrust', name: 'Barbell Hip Thrust', muscle: 'Glutes', equip: 'Barbell',
        slugs: ['Barbell_Hip_Thrust', 'Barbell_Glute_Bridge'],
        steps: ['Sit on the floor with upper back against a bench and a padded barbell across your hip crease.', 'Plant feet flat shoulder-width apart so shins are vertical at the top.', 'Drive through your heels, squeeze glutes hard, and lift hips until torso is parallel to the floor.', 'Pause 1 second at peak contraction, then lower hips under control.'],
        cue: 'Keep ribs tucked down and chin slightly nodded—avoid overarching your lower back at the top.' },
      { id: 'glute_bridge', name: 'Dumbbell Glute Bridge', muscle: 'Glutes', equip: 'Dumbbells',
        slugs: ['Barbell_Glute_Bridge', 'Butt_Lift_Bridge'],
        steps: ['Lie flat on a mat with knees bent, feet flat hip-width apart, and a dumbbell resting on your hips.', 'Press lower back gently into the floor to brace your core.', 'Push through your heels to lift hips high, squeezing glutes tightly.', 'Lower slowly without letting tension fully leave the glutes.'],
        cue: 'Imagine dragging your heels toward your glutes to maximize posterior chain engagement.' },
      { id: 'cable_glute_kickback', name: 'Cable Glute Kickback', muscle: 'Glutes', equip: 'Cable',
        slugs: ['One-Legged_Cable_Kickback', 'Glute_Kickback'],
        steps: ['Attach an ankle cuff to a low cable pulley and hold the frame for stability.', 'Hinge torso forward slightly with a flat back and soft standing knee.', 'Kick the cuffed leg straight back and slightly outward, squeezing the glute at full extension.', 'Return the leg forward slowly without swinging.'],
        cue: 'Keep your hips square to the machine—do not twist your pelvis to gain extra height.' },
      { id: 'bulgarian_split_squat', name: 'Bulgarian Split Squat', muscle: 'Glutes', equip: 'Dumbbells',
        slugs: ['Split_Squat_with_Dumbbells', 'Dumbbell_Lunges'],
        steps: ['Stand two feet in front of a bench and rest the top of your back foot on the pad.', 'Hold dumbbells at your sides and lean your torso slightly forward for glute bias.', 'Lower your back knee toward the floor until your front thigh is parallel.', 'Drive through your front heel and mid-foot back to standing.'],
        cue: 'Keep front knee tracking over your second and third toes; avoid caving inward.' },
      { id: 'sumo_squat', name: 'Dumbbell Sumo Squat', muscle: 'Glutes', equip: 'Dumbbells',

        steps: ['Take a wide stance with toes pointed outward at 35–45 degrees, holding one heavy dumbbell vertically.', 'Brace your core and keep your chest proud.', 'Sit straight down between your heels, pushing knees outward in line with toes.', 'Drive through heels and squeeze glutes at the top.'],

        slugs: ['Dumbbell_Step_Ups', 'Step-up_with_Knee_Raise'],
        steps: ['Place one foot firmly on a knee-high box or bench holding dumbbells at your sides.', 'Lean torso slightly forward and load your front heel.', 'Step up smoothly without pushing off your back toes.', 'Lower yourself down slowly over 2–3 seconds.'],

      { id: 'seated_hip_abduction', name: 'Seated Hip Abduction Machine', muscle: 'Glutes', equip: 'Machine',

        steps: ['Sit upright against the backrest with outer knees pressed against the pads.', 'Brace your core and grip the side handles.', 'Press knees outward smoothly as far as comfortably possible.', 'Pause briefly, then resist the weight as knees return together.'],

        steps: ['Attach a rope to a low pulley, straddle the cable facing away, and step forward to create tension.', 'With soft knees and a flat back, hinge hips straight back letting hands travel between thighs.', 'Feel a deep hamstring/glute stretch, then snap hips forward to stand tall.', 'Squeeze glutes firmly at lockout.'],

      // LEGS (8)
      { id: 'goblet_squat', name: 'Dumbbell Goblet Squat', muscle: 'Legs', equip: 'Dumbbells',
        slugs: ['Goblet_Squat', 'Dumbbell_Squat'],
        steps: ['Hold a dumbbell vertically against your chest with elbows tucked underneath.', 'Stand shoulder-width apart with toes slightly turned out.', 'Inhale, brace your core, and sit down between your knees until thighs reach parallel or below.', 'Exhale and drive evenly through both feet to stand.'],
        cue: 'Keep elbows pointing down inside your knees at the bottom to maintain an upright torso.' },
      { id: 'barbell_back_squat', name: 'Barbell Back Squat', muscle: 'Legs', equip: 'Barbell',
        slugs: ['Barbell_Full_Squat', 'Barbell_Squat'],
        steps: ['Rest the barbell across your upper traps/rear delts and unrack with feet shoulder-width apart.', 'Take a deep breath into your belly, brace your abs, and unlock hips and knees together.', 'Descend smoothly to parallel while keeping heels planted.', 'Drive upward strongly, keeping chest and hips rising at the same rate.'],

      { id: 'romanian_deadlift', name: 'Romanian Deadlift (RDL)', muscle: 'Legs', equip: 'Dumbbells',

      { id: 'lying_leg_curl', name: 'Lying / Seated Leg Curl', muscle: 'Legs', equip: 'Machine',

      { id: 'leg_extension', name: 'Seated Leg Extension', muscle: 'Legs', equip: 'Machine',
        slugs: ['Leg_Extensions', 'Single-Leg_Leg_Extension'],
        steps: ['Adjust the backrest so knees align with the machine pivot and pad rests on lower shins.', 'Grip side handles to anchor your hips in the seat.', 'Extend knees smoothly until legs are straight, pausing briefly at the top.', 'Lower weight under control without letting plates slam.'],

      { id: 'standing_calf_raise', name: 'Standing Calf Raise', muscle: 'Legs', equip: 'Bodyweight',

    /* =========================================================================
       REAL PHOTO FLIPBOOK ENGINE (free-exercise-db + CDN Mirrors + Custom Photos)
       ========================================================================= */
    const IMAGE_BASES = [
      'https://raw.githubusercontent.com/yuhonas/free-exercise-db/main/exercises/',
      'https://cdn.jsdelivr.net/gh/yuhonas/free-exercise-db@main/exercises/'
    ];

    function getPhotoCandidateURLs(ex, frameIdx) {
      // Custom uploaded data URLs take top priority
      if (frameIdx === 0 && ex.customPhoto0) return [ex.customPhoto0];
      if (frameIdx === 1 && ex.customPhoto1) return [ex.customPhoto1, ex.customPhoto0].filter(Boolean);

      const slugs = (ex.slugs && ex.slugs.length) ? ex.slugs : ['Goblet_Squat'];
      const urls = [];
      for (const slug of slugs) {
        for (const base of IMAGE_BASES) {
          urls.push(`${base}${slug}/${frameIdx}.jpg`);
        }
      }
      return urls;
    }

    // Automatic multi-mirror fallback handler attached globally
    window.handleFlipbookImgError = function(imgEl) {
      const fallbacks = (imgEl.dataset.fallbacks || '').split('|').filter(Boolean);
      if (fallbacks.length > 0) {
        const nextUrl = fallbacks.shift();
        imgEl.dataset.fallbacks = fallbacks.join('|');
        imgEl.src = nextUrl;
      } else {
        imgEl.style.display = 'none';
        const stage = imgEl.closest('.flipbook-viewport');
        if (stage) {
          const fb = stage.querySelector('.flipbook-fallback');
          if (fb) fb.classList.add('visible');
        }
      }
    };

    function renderPhotoThumbHTML(ex) {
      const urls0 = getPhotoCandidateURLs(ex, 0);
      const first = urls0[0];
      const rest = urls0.slice(1).join('|');
      return `
        <img src="${escapeHTML(first)}"
             data-fallbacks="${escapeHTML(rest)}"
             alt="${escapeHTML(ex.name)}"
             loading="lazy"
             onerror="handleFlipbookImgError(this)" />
      `;
    }

    function renderPhotoFlipbookHTML(ex, mode = 'animate', targetKey = 'fb0') {
      const urls0 = getPhotoCandidateURLs(ex, 0);
      const urls1 = getPhotoCandidateURLs(ex, 1);
      const activePose = mode === 'peak' ? '1' : '0';
      const badgeLabel = activePose === '1' ? '2. PEAK CONTRACTION' : '1. START POSITION';

      return `
        <div class="flipbook-viewport"
             id="vp_${escapeHTML(targetKey)}"
             data-flip-key="${escapeHTML(targetKey)}"
             data-mode="${escapeHTML(mode)}"
             data-active-pose="${activePose}"
             onclick="manualToggleFlipPose('${escapeHTML(targetKey)}')"
             title="Tap photo to switch Start / Peak pose">
          <div class="flipbook-phase-badge">
            <span class="dot"></span>
            <span class="phase-text">${badgeLabel}</span>
          </div>

          <img class="flipbook-img pose-0"
               src="${escapeHTML(urls0[0])}"
               data-fallbacks="${escapeHTML(urls0.slice(1).join('|'))}"
               alt="${escapeHTML(ex.name)} — Start Position"
               onerror="handleFlipbookImgError(this)" />

          <img class="flipbook-img pose-1"
               src="${escapeHTML(urls1[0])}"
               data-fallbacks="${escapeHTML(urls1.slice(1).join('|'))}"
               alt="${escapeHTML(ex.name)} — Peak Position"
               onerror="handleFlipbookImgError(this)" />

          <div class="flipbook-fallback">
            <span class="badge badge-primary" style="margin-bottom:6px;">${escapeHTML(ex.muscle)} • ${escapeHTML(ex.equip)}</span>
            <strong style="font-size:14px;margin-bottom:4px;">${escapeHTML(ex.name)}</strong>
            <span style="font-size:12px;color:var(--text-muted);">Connect to internet once to cache exercise photos, or follow the step-by-step cues below.</span>
          </div>

          <div class="flipbook-tap-hint">Tap photo to flip</div>
        </div>
        <div>
          <div class="pose-controls" data-pose-target="${escapeHTML(targetKey)}">
            <button type="button" class="pose-btn ${mode === 'animate' ? 'active' : ''}" data-mode="animate">Animate</button>
            <button type="button" class="pose-btn ${mode === 'start' ? 'active' : ''}" data-mode="start">1. Start</button>
            <button type="button" class="pose-btn ${mode === 'peak' ? 'active' : ''}" data-mode="peak">2. Peak</button>
          </div>
        </div>
        <div class="muscle-legend"><span class="pulse-dot"></span> Target: ${escapeHTML(ex.muscle)} (${escapeHTML(ex.equip)})</div>
      `;
    }

    function setViewportPose(vp, poseStr) {
      vp.setAttribute('data-active-pose', poseStr);
      const labelEl = vp.querySelector('.phase-text');
      if (labelEl) {
        labelEl.textContent = poseStr === '1' ? '2. PEAK CONTRACTION' : '1. START POSITION';
      }
    }

    function manualToggleFlipPose(targetKey) {
      const vp = document.getElementById('vp_' + targetKey);
      if (!vp) return;
      const nextPose = vp.getAttribute('data-active-pose') === '1' ? '0' : '1';
      const newMode = nextPose === '1' ? 'peak' : 'start';
      state.poseModes[targetKey] = newMode;
      vp.setAttribute('data-mode', newMode);
      setViewportPose(vp, nextPose);

      const controls = document.querySelector(`.pose-controls[data-pose-target="${targetKey}"]`);
      if (controls) {
        controls.querySelectorAll('.pose-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === newMode));
      }
    }

    // Global 1.65-second heartbeat that crossfades any visible flipbook in 'animate' mode
    setInterval(() => {
      document.querySelectorAll('.flipbook-viewport[data-mode="animate"]').forEach(vp => {
        if (vp.offsetParent === null) return; // skip hidden elements
        const nextPose = vp.getAttribute('data-active-pose') === '1' ? '0' : '1';
        setViewportPose(vp, nextPose);
      });
    }, 1650);

    /* =========================================================================
       STATE MANAGEMENT & PERSISTENCE
       ========================================================================= */
    function loadJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    }

    function saveJSON(key, val) {
      try {
        localStorage.setItem(key, JSON.stringify(val));
      } catch (e) {
        console.warn('Storage write warning:', e);
      }
    }

    let state = {
      workouts: loadJSON(STORAGE_KEYS.WORKOUTS, []),
      history: loadJSON(STORAGE_KEYS.HISTORY, []),
      customExercises: loadJSON(STORAGE_KEYS.CUSTOM_EXERCISES, []),
      theme: localStorage.getItem(STORAGE_KEYS.THEME) || 'light',
      activeSession: loadJSON(STORAGE_KEYS.ACTIVE_SESSION, null),
      guideExpanded: localStorage.getItem(STORAGE_KEYS.GUIDE_EXPANDED) !== 'false',
      currentTab: 'workouts',
      guideFilterMuscle: 'All',
      guideSearch: '',
      expandedGuideCards: {},
      poseModes: {},
      editingWorkoutId: null,
      builderExercises: []
    };

    function getAllExercises() {
      return [...BUILTIN_EXERCISES, ...state.customExercises];
    }

    function getExerciseById(id) {
      return getAllExercises().find(e => e.id === id) || {
        id,
        name: 'Exercise',
        muscle: 'General',
        equip: 'Bodyweight',
        slugs: ['Goblet_Squat'],
        steps: ['Perform movement with controlled form.'],
        cue: 'Maintain steady breathing and core stability.'
      };
    }

    function escapeHTML(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    /* =========================================================================
       THEME TOGGLE
       ========================================================================= */
    function applyTheme(theme) {

    /* Compress uploaded iPhone photo to compact JPEG Data URL for localStorage */
    function compressImageFile(file, maxDim = 480) {
      return new Promise((resolve) => {
        if (!file) return resolve(null);
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            let w = img.width;
            let h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) {
                h = Math.round((h * maxDim) / w);
                w = maxDim;
              } else {
                w = Math.round((w * maxDim) / h);
                h = maxDim;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', 0.78));
          };
          img.onerror = () => resolve(null);
          img.src = ev.target.result;
        };
        reader.onerror = () => resolve(null);
        reader.readAsDataURL(file);
      });
    }

    /* =========================================================================
       ACTIVE WORKOUT PLAYER + REST TIMER + WEB AUDIO CHIME
       ========================================================================= */
    let elapsedInterval = null;
    let restInterval = null;
    let restRemaining = 0;

    function playRestChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        [523.25, 659.25, 783.99].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.001, ctx.currentTime + idx * 0.14);
          gain.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + idx * 0.14 + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.14 + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.14);
          osc.stop(ctx.currentTime + idx * 0.14 + 0.36);
        });
      } catch (e) {}
    }

    function startRestTimer(seconds) {
      restRemaining = seconds;
      const pill = document.getElementById('restTimerPill');
      pill.classList.add('visible');
      updateRestDisplay();
      clearInterval(restInterval);
      restInterval = setInterval(() => {
        restRemaining--;
        if (restRemaining <= 0) {
          clearInterval(restInterval);
          pill.classList.remove('visible');
          playRestChime();
        } else {
          updateRestDisplay();
        }
      }, 1000);
    }

    function updateRestDisplay() {
      const m = String(Math.floor(restRemaining / 60)).padStart(2, '0');
      const s = String(restRemaining % 60).padStart(2, '0');
      document.getElementById('restCountdown').textContent = `${m}:${s}`;
    }

    document.getElementById('restSubBtn').addEventListener('click', () => {
      restRemaining = Math.max(1, restRemaining - 15);
      updateRestDisplay();
    });
    document.getElementById('restAddBtn').addEventListener('click', () => {
      restRemaining += 15;
      updateRestDisplay();
    });
    document.getElementById('restSkipBtn').addEventListener('click', () => {
      clearInterval(restInterval);
      document.getElementById('restTimerPill').classList.remove('visible');
    });

    function getPreviousSetsForExercise(exId) {
      for (const session of state.history) {
        const found = session.exercises.find(e => e.exerciseId === exId);
        if (found && found.sets && found.sets.length) {
          return found.sets;
        }
      }
      return [];
    }

    function startWorkout(workoutId) {
      const workout = state.workouts.find(w => w.id === workoutId);
      if (!workout) return;

      const session = {
        workoutId: workout.id,
        workoutName: workout.name,
        startedAt: Date.now(),
        currentExIndex: 0,
        exercises: workout.exercises.map(item => {
          const prevSets = getPreviousSetsForExercise(item.exerciseId);
          const sets = [];
          for (let i = 0; i < item.sets; i++) {
            const prev = prevSets[i] || prevSets[prevSets.length - 1];
            sets.push({
              weight: prev ? prev.weight : 10,
              reps: prev ? prev.reps : item.reps,
              completed: false
            });
          }
          return {
            exerciseId: item.exerciseId,
            rest: item.rest || 60,
            sets
          };
        })
      };

      state.activeSession = session;
      saveJSON(STORAGE_KEYS.ACTIVE_SESSION, session);
      openPlayerOverlay();
    }

    function resumeActiveSession() {
      if (state.activeSession) openPlayerOverlay();
    }

    function openPlayerOverlay() {
      const overlay = document.getElementById('workoutPlayer');
      overlay.classList.add('open');
      document.getElementById('playerWorkoutTitle').textContent = state.activeSession.workoutName;
      startElapsedClock();
      renderPlayerBody();
    }

    function startElapsedClock() {
      clearInterval(elapsedInterval);
      const tick = () => {
        if (!state.activeSession) return;
        const sec = Math.max(0, Math.floor((Date.now() - state.activeSession.startedAt) / 1000));
        const m = String(Math.floor(sec / 60)).padStart(2, '0');
        const s = String(sec % 60).padStart(2, '0');
        document.getElementById('playerElapsedTimer').textContent = `${m}:${s}`;
      };
      tick();
      elapsedInterval = setInterval(tick, 1000);
    }

    document.getElementById('minimizePlayerBtn').addEventListener('click', () => {
      document.getElementById('workoutPlayer').classList.remove('open');
      renderResumeBanner();
    });

    function renderPlayerBody() {
      const sess = state.activeSession;
      if (!sess) return;
      const idx = sess.currentExIndex;
      const item = sess.exercises[idx];
      const ex = getExerciseById(item.exerciseId);
      const prevSets = getPreviousSetsForExercise(item.exerciseId);
      const targetKey = 'player_' + ex.id;
      const mode = state.poseModes[targetKey] || 'animate';

      const body = document.getElementById('playerBody');
      body.innerHTML = `
        <div class="ex-nav-bar">
          <button class="btn btn-secondary btn-sm" onclick="switchPlayerEx(${idx - 1})" ${idx === 0 ? 'disabled' : ''}>← Prev</button>
          <div class="ex-dots">
            ${sess.exercises.map((e, i) => {
              const allDone = e.sets.length > 0 && e.sets.every(s => s.completed);
              return `<button class="ex-dot ${i === idx ? 'active' : ''} ${allDone ? 'done' : ''}" onclick="switchPlayerEx(${i})">${i + 1}</button>`;
            }).join('')}
          </div>
          <button class="btn btn-secondary btn-sm" onclick="switchPlayerEx(${idx + 1})" ${idx === sess.exercises.length - 1 ? 'disabled' : ''}>Next →</button>
        </div>

        <div style="margin-bottom:10px;">
          <div style="font-size:12px;font-weight:700;color:var(--primary-text);">EXERCISE ${idx + 1} OF ${sess.exercises.length} • ${escapeHTML(ex.muscle.toUpperCase())}</div>
          <h2 style="margin:2px 0 0;font-size:21px;font-weight:800;">${escapeHTML(ex.name)}</h2>
        </div>

        <!-- Collapsible How-To Form Guide Card -->
        <div class="form-accordion">
          <button class="form-accordion-btn" onclick="togglePlayerGuide()">
            <span style="display:flex;align-items:center;gap:7px;">
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="2.3"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
              How to Complete This Exercise (Photos)
            </span>
            <span>${state.guideExpanded ? 'Hide ▴' : 'Show ▾'}</span>
          </button>
          ${state.guideExpanded ? `
            <div class="form-accordion-body">
              <div class="flipbook-stage">
                ${renderPhotoFlipbookHTML(ex, mode, targetKey)}
              </div>
              <ol class="steps-list">
                ${ex.steps.map(s => `<li>${escapeHTML(s)}</li>`).join('')}
              </ol>
              <div class="cue-box">
                <strong>Form Cue:</strong> ${escapeHTML(ex.cue)}
              </div>
            </div>
          ` : ''}
        </div>

        <!-- Set Logging Table -->
        <div style="display:grid;grid-template-columns:32px 1fr 1.15fr 1.15fr 44px;gap:6px;padding:0 8px 6px;font-size:11px;font-weight:700;color:var(--text-muted);text-align:center;">
          <span>SET</span>
          <span>PREVIOUS</span>
          <span>KG</span>
          <span>REPS</span>
          <span>DONE</span>
        </div>

        ${item.sets.map((s, sIdx) => {
          const prev = prevSets[sIdx];
          const prevLabel = prev ? `${prev.weight}kg × ${prev.reps}` : '—';
          return `
            <div class="set-row ${s.completed ? 'completed' : ''}">
              <div class="set-num">${sIdx + 1}</div>
              <div class="prev-val">${prevLabel}</div>
              <div class="stepper">
                <button class="step-btn" onclick="adjustSetVal(${idx},${sIdx},'weight',-2.5)">−</button>
                <input type="number" step="0.5" class="step-input" value="${s.weight}" onchange="setExactVal(${idx},${sIdx},'weight',this.value)" />
                <button class="step-btn" onclick="adjustSetVal(${idx},${sIdx},'weight',2.5)">+</button>
              </div>
              <div class="stepper">
                <button class="step-btn" onclick="adjustSetVal(${idx},${sIdx},'reps',-1)">−</button>
                <input type="number" class="step-input" value="${s.reps}" onchange="setExactVal(${idx},${sIdx},'reps',this.value)" />
                <button class="step-btn" onclick="adjustSetVal(${idx},${sIdx},'reps',1)">+</button>
              </div>
              <button class="check-btn" onclick="toggleSetComplete(${idx},${sIdx})" aria-label="Complete Set">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </button>
            </div>
          `;
        }).join('')}

        <div style="display:flex;gap:8px;margin-top:10px;">
          <button class="btn btn-secondary btn-sm btn-block" onclick="addPlayerSet(${idx})">+ Add Set</button>
          ${item.sets.length > 1 ? `<button class="btn btn-danger-soft btn-sm" onclick="removeLastPlayerSet(${idx})">Remove Set</button>` : ''}
        </div>
      `;
    }

    function togglePlayerGuide() {
      state.guideExpanded = !state.guideExpanded;
      localStorage.setItem(STORAGE_KEYS.GUIDE_EXPANDED, String(state.guideExpanded));
      renderPlayerBody();
    }

    function switchPlayerEx(newIdx) {
      if (!state.activeSession) return;
      if (newIdx < 0 || newIdx >= state.activeSession.exercises.length) return;
      state.activeSession.currentExIndex = newIdx;
      saveJSON(STORAGE_KEYS.ACTIVE_SESSION, state.activeSession);
      renderPlayerBody();
      document.getElementById('playerBody').scrollTop = 0;
    }

    function adjustSetVal(exIdx, setIdx, field, delta) {
      const s = state.activeSession.exercises[exIdx].sets[setIdx];
      const minVal = field === 'reps' ? 1 : 0;
      s[field] = Math.max(minVal, Math.round((Number(s[field]) + delta) * 10) / 10);
      saveJSON(STORAGE_KEYS.ACTIVE_SESSION, state.activeSession);
      renderPlayerBody();
    }

    function setExactVal(exIdx, setIdx, field, raw) {
      const s = state.activeSession.exercises[exIdx].sets[setIdx];
      const parsed = parseFloat(raw);
      s[field] = isNaN(parsed) ? 0 : Math.max(0, parsed);
      saveJSON(STORAGE_KEYS.ACTIVE_SESSION, state.activeSession);
    }

    function toggleSetComplete(exIdx, setIdx) {
      const item = state.activeSession.exercises[exIdx];
      const s = item.sets[setIdx];
      s.completed = !s.completed;
      saveJSON(STORAGE_KEYS.ACTIVE_SESSION, state.activeSession);
      if (s.completed) {
        startRestTimer(item.rest || 60);
      }
      renderPlayerBody();
    }

    function addPlayerSet(exIdx) {
      const sets = state.activeSession.exercises[exIdx].sets;
      const last = sets[sets.length - 1] || { weight: 10, reps: 12 };
      sets.push({ weight: last.weight, reps: last.reps, completed: false });
      saveJSON(STORAGE_KEYS.ACTIVE_SESSION, state.activeSession);
      renderPlayerBody();
    }

    function removeLastPlayerSet(exIdx) {
      const sets = state.activeSession.exercises[exIdx].sets;
      if (sets.length > 1) {
        sets.pop();
        saveJSON(STORAGE_KEYS.ACTIVE_SESSION, state.activeSession);
        renderPlayerBody();
      }
    }

    /* Finish Workout & PR Detection */
    document.getElementById('finishWorkoutBtn').addEventListener('click', () => {
      const sess = state.activeSession;
      if (!sess) return;

      const completedExercises = sess.exercises.map(item => ({
        exerciseId: item.exerciseId,
        sets: item.sets.filter(s => s.completed)
      })).filter(item => item.sets.length > 0);

      if (!completedExercises.length) {
        if (confirm('No sets were ticked complete. Discard this session?')) {
          clearActiveSession();
        }
        return;
      }

      // Compute historical best weight per exercise
      const prevMaxWeight = {};
      state.history.forEach(h => {
        h.exercises.forEach(e => {
          e.sets.forEach(s => {
            if (!prevMaxWeight[e.exerciseId] || s.weight > prevMaxWeight[e.exerciseId]) {
              prevMaxWeight[e.exerciseId] = s.weight;
            }
          });
        });
      });

      let totalSets = 0;
      let totalTonnage = 0;
      const newPRs = [];

      completedExercises.forEach(e => {
        const exInfo = getExerciseById(e.exerciseId);
        let sessionBest = 0;
        e.sets.forEach(s => {
          totalSets++;
          totalTonnage += (Number(s.weight) || 0) * (Number(s.reps) || 0);
          if (s.weight > sessionBest) sessionBest = s.weight;
        });
        const oldBest = prevMaxWeight[e.exerciseId] || 0;
        if (sessionBest > 0 && sessionBest > oldBest) {
          newPRs.push({ name: exInfo.name, weight: sessionBest });
        }
      });

      const durationMin = Math.max(1, Math.round((Date.now() - sess.startedAt) / 60000));
      const logEntry = {
        id: 'log_' + Date.now(),
        workoutId: sess.workoutId,
        workoutName: sess.workoutName,
        date: new Date().toISOString(),
        durationMin,
        totalSets,
        totalTonnage: Math.round(totalTonnage),
        exercises: completedExercises
      };

      state.history.unshift(logEntry);
      saveJSON(STORAGE_KEYS.HISTORY, state.history);
      clearActiveSession();

      // Show Summary Modal
      document.getElementById('summaryModalBody').innerHTML = `
        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-label">Duration</div>
            <div class="kpi-val">${durationMin} min</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Sets Completed</div>
            <div class="kpi-val">${totalSets}</div>
          </div>
          <div class="kpi-card" style="grid-column:span 2;">
            <div class="kpi-label">Total Volume Lifted</div>
            <div class="kpi-val">${Math.round(totalTonnage).toLocaleString()} kg</div>
          </div>
        </div>
        ${newPRs.length ? `
          <div style="background:var(--warning-soft);border:1px solid var(--warning);border-radius:12px;padding:12px;">
            <strong style="font-size:14px;">🏆 New Personal Records!</strong>
            <ul style="margin:6px 0 0;padding-left:18px;font-size:13.5px;">
              ${newPRs.map(p => `<li><strong>${escapeHTML(p.name)}</strong>: ${p.weight} kg</li>`).join('')}
            </ul>
          </div>
        ` : `<p style="color:var(--text-muted);font-size:13.5px;margin:0;">Great session! Every completed set is saved to your progress metrics.</p>`}
      `;
      document.getElementById('summaryModal').classList.add('open');
      renderWorkoutsTab();
    });

    function clearActiveSession() {
      state.activeSession = null;
      localStorage.removeItem(STORAGE_KEYS.ACTIVE_SESSION);
      clearInterval(elapsedInterval);
      clearInterval(restInterval);
      document.getElementById('restTimerPill').classList.remove('visible');
      document.getElementById('workoutPlayer').classList.remove('open');
      renderResumeBanner();
    }

    document.getElementById('closeSummaryBtn').addEventListener('click', () => {
      document.getElementById('summaryModal').classList.remove('open');
    });
    document.getElementById('doneSummaryBtn').addEventListener('click', () => {
      document.getElementById('summaryModal').classList.remove('open');
    });

    /* =========================================================================
       TAB 3: METRICS & ANALYTICS
       ========================================================================= */
    function renderMetricsTab() {
      const container = document.getElementById('metricsContainer');
      const totalWorkouts = state.history.length;
      const totalTonnage = state.history.reduce((sum, h) => sum + (h.totalTonnage || 0), 0);
      const totalSets = state.history.reduce((sum, h) => sum + (h.totalSets || 0), 0);

      // Weekly Muscle Volume (last 7 days)
      const sevenDaysAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
      const muscleSets = {};
      state.history.filter(h => new Date(h.date).getTime() >= sevenDaysAgo).forEach(h => {
        h.exercises.forEach(e => {
          const ex = getExerciseById(e.exerciseId);
          muscleSets[ex.muscle] = (muscleSets[ex.muscle] || 0) + e.sets.length;
        });
      });
      const maxMuscleSets = Math.max(10, ...Object.values(muscleSets));

      // PR Leaderboard
      const prMap = {};
      state.history.forEach(h => {
        h.exercises.forEach(e => {
          e.sets.forEach(s => {
            const w = Number(s.weight) || 0;
            const r = Number(s.reps) || 0;
            const est1RM = Math.round(w * (1 + r / 30));
            if (!prMap[e.exerciseId] || w > prMap[e.exerciseId].weight) {
              prMap[e.exerciseId] = {
                name: getExerciseById(e.exerciseId).name,
                weight: w,
                reps: r,
                est1RM
              };
            }
          });
        });
      });
      const prList = Object.values(prMap).sort((a, b) => b.weight - a.weight).slice(0, 6);

      // Last 8 Sessions Tonnage Chart SVG
      const recent8 = [...state.history].slice(0, 8).reverse();
      let chartSVG = `<div style="text-align:center;color:var(--text-muted);font-size:13px;padding:18px 0;">Complete a workout to unlock your tonnage trend graph.</div>`;
      if (recent8.length >= 1) {
        const maxT = Math.max(100, ...recent8.map(s => s.totalTonnage || 0));
        const pts = recent8.map((s, i) => {
          const x = recent8.length === 1 ? 150 : 24 + (i * (252 / (recent8.length - 1)));
          const y = 96 - ((s.totalTonnage || 0) / maxT) * 74;
          return { x, y, val: s.totalTonnage || 0, label: new Date(s.date).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) };
        });
        const poly = pts.map(p => `${p.x},${p.y}`).join(' ');
        chartSVG = `
          <svg viewBox="0 0 300 120" style="width:100%;height:130px;overflow:visible;">
            <polyline fill="none" stroke="var(--primary)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${poly}" />
            ${pts.map(p => `
              <circle cx="${p.x}" cy="${p.y}" r="4.5" fill="var(--accent)" />
              <text x="${p.x}" y="${p.y - 8}" text-anchor="middle" font-size="9.5" font-weight="700" fill="var(--text)">${p.val}kg</text>
              <text x="${p.x}" y="114" text-anchor="middle" font-size="9" fill="var(--text-muted)">${p.label}</text>
            `).join('')}
          </svg>
        `;
      }

      // 56-Day Consistency Heatmap
      const dayCounts = {};
      state.history.forEach(h => {
        const key = new Date(h.date).toISOString().slice(0, 10);
        dayCounts[key] = (dayCounts[key] || 0) + 1;
      });
      const heatCells = [];
      for (let i = 55; i >= 0; i--) {
        const d = new Date(Date.now() - i * 86400000).toISOString().slice(0, 10);
        const c = dayCounts[d] || 0;
        const cls = c >= 2 ? 'l3' : c === 1 ? 'l2' : '';
        heatCells.push(`<div class="heat-cell ${cls}" title="${d}: ${c} workout(s)"></div>`);
      }

      container.innerHTML = `
        <div class="kpi-grid">
          <div class="kpi-card">
            <div class="kpi-label">Workouts Logged</div>
            <div class="kpi-val">${totalWorkouts}</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Total Tonnage</div>
            <div class="kpi-val">${totalTonnage.toLocaleString()} kg</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Total Sets</div>
            <div class="kpi-val">${totalSets}</div>
          </div>
          <div class="kpi-card">
            <div class="kpi-label">Personal Records</div>
            <div class="kpi-val">${Object.keys(prMap).length}</div>
          </div>
        </div>

        <div class="card">
          <h3 style="margin:0 0 10px;font-size:15.5px;">Weekly Muscle Group Volume (Sets)</h3>
          ${Object.keys(muscleSets).length ? Object.entries(muscleSets).map(([m, sets]) => `
            <div class="vol-bar-row">
              <div class="vol-bar-top"><span>${escapeHTML(m)}</span><span>${sets} sets</span></div>
              <div class="vol-track"><div class="vol-fill" style="width:${Math.min(100, (sets / maxMuscleSets) * 100)}%"></div></div>
            </div>
          `).join('') : `<p style="margin:0;color:var(--text-muted);font-size:13px;">Log a workout this week to track sets per muscle group.</p>`}
        </div>

        <div class="card">
          <h3 style="margin:0 0 8px;font-size:15.5px;">Session Tonnage Trend</h3>
          ${chartSVG}
        </div>

        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <h3 style="margin:0;font-size:15.5px;">8-Week Consistency</h3>
            <span style="font-size:11.5px;color:var(--text-muted);">Last 56 days</span>
          </div>
          <div class="heatmap-grid">${heatCells.join('')}</div>
        </div>

        <div class="card">
          <h3 style="margin:0 0 10px;font-size:15.5px;">Personal Records (PRs)</h3>
          ${prList.length ? prList.map(p => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--border);font-size:13.5px;">
              <strong>${escapeHTML(p.name)}</strong>
              <span class="badge badge-success">${p.weight} kg × ${p.reps} (Est. 1RM: ${p.est1RM} kg)</span>
            </div>
          `).join('') : `<p style="margin:0;color:var(--text-muted);font-size:13px;">Your best lifts will automatically appear here.</p>`}
        </div>

        <div class="card">
          <h3 style="margin:0 0 8px;font-size:15.5px;">Backup &amp; Restore Data</h3>
          <p style="margin:0 0 10px;font-size:12.5px;color:var(--text-muted);">Export her routines and workout history as JSON anytime.</p>
          <div style="display:flex;gap:8px;">
            <button class="btn btn-secondary btn-sm btn-block" onclick="exportBackupJSON()">Export JSON</button>
            <button class="btn btn-secondary btn-sm btn-block" onclick="importBackupJSON()">Import JSON</button>
          </div>
        </div>
      `;
    }

    function exportBackupJSON() {
      const payload = {
        exportedAt: new Date().toISOString(),
        workouts: state.workouts,
        history: state.history,
        customExercises: state.customExercises
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `form-and-fit-backup-${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importBackupJSON() {
      const raw = prompt('Paste your exported JSON backup text here:');
      if (!raw) return;
      try {
        const data = JSON.parse(raw);
        if (Array.isArray(data.workouts)) state.workouts = data.workouts;
        if (Array.isArray(data.history)) state.history = data.history;
        if (Array.isArray(data.customExercises)) state.customExercises = data.customExercises;
        saveJSON(STORAGE_KEYS.WORKOUTS, state.workouts);
        saveJSON(STORAGE_KEYS.HISTORY, state.history);
        saveJSON(STORAGE_KEYS.CUSTOM_EXERCISES, state.customExercises);
        renderMetricsTab();
        alert('Backup restored successfully!');
      } catch (e) {
        alert('Invalid JSON backup format.');
      }
    }

    /* =========================================================================
       INITIALIZE APP
       ========================================================================= */
    applyTheme(state.theme);
    renderWorkoutsTab();
  </script>
</body>
</html>
